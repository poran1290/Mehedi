<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCN - Smart Investment</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header class="topbar">
    <div class="brand">RCN</div>

    <div class="top-actions">
      <button type="button">🔔</button>
      <span>🌐 বাংলা⌄</span>
    </div>
  </header>

  <main>
    <section class="welcome">
      <div class="lightning">✦</div>
      <h1>RCN</h1>
      <p>আপনার স্মার্ট ইনভেস্টমেন্ট প্ল্যাটফর্ম</p>
    </section>

    <section class="auth-box">

      <div class="tabs">
        <button id="loginTab" class="active" type="button" onclick="showLogin()">
          লগইন
        </button>

        <button id="registerTab" type="button" onclick="showRegister()">
          রেজিস্ট্রেশন
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <label for="loginPhone">ফোন নম্বর</label>

        <div class="phone-input">
          <span>🇧🇩 +880</span>
          <input
            id="loginPhone"
            type="tel"
            placeholder="আপনার ফোন নম্বর লিখুন"
            required
          >
        </div>

        <label for="loginPassword">পাসওয়ার্ড</label>

        <div class="password-box">
          <input
            id="loginPassword"
            type="password"
            placeholder="আপনার পাসওয়ার্ড লিখুন"
            required
          >

          <button type="button" onclick="togglePassword('loginPassword', this)">
            👁
          </button>
        </div>

        <div class="forgot">
          <a href="#" onclick="forgotPassword(); return false;">
            পাসওয়ার্ড ভুলে গেছেন?
          </a>
        </div>

        <button class="submit-btn" type="submit">
          লগইন করুন
        </button>

        <p class="switch-text">
          অ্যাকাউন্ট নেই?
          <a href="#" onclick="showRegister(); return false;">
            রেজিস্ট্রেশন করুন
          </a>
        </p>
      </form>

      <!-- Registration Form -->
      <form id="registerForm" class="hidden">

        <label for="fullName">আপনার নাম</label>
        <input
          id="fullName"
          type="text"
          placeholder="আপনার পূর্ণ নাম লিখুন"
          required
        >

        <label for="registerPhone">ফোন নম্বর</label>

        <div class="phone-input">
          <span>🇧🇩 +880</span>
          <input
            id="registerPhone"
            type="tel"
            placeholder="আপনার ফোন নম্বর লিখুন"
            required
          >
        </div>

        <label for="registerPassword">পাসওয়ার্ড</label>

        <div class="password-box">
          <input
            id="registerPassword"
            type="password"
            placeholder="একটি শক্তিশালী পাসওয়ার্ড দিন"
            required
          >

          <button type="button" onclick="togglePassword('registerPassword', this)">
            👁
          </button>
        </div>

        <label for="referral">
          রেফারেল কোড <small>(যদি থাকে)</small>
        </label>

        <input
          id="referral"
          type="text"
          placeholder="রেফারেল কোড লিখুন"
        >

        <label class="check">
          <input type="checkbox" required>
          <span>আমি শর্তাবলিতে সম্মত</span>
        </label>

        <button class="submit-btn" type="submit">
          রেজিস্ট্রেশন করুন
        </button>

        <p class="switch-text">
          ইতিমধ্যে অ্যাকাউন্ট আছে?
          <a href="#" onclick="showLogin(); return false;">
            লগইন করুন
          </a>
        </p>
      </form>

    </section>

    <p class="notice">
      RCN একটি ডেমো ইনভেস্টমেন্ট প্ল্যাটফর্ম। বিনিয়োগের আগে সব তথ্য যাচাই করুন।
    </p>
  </main>

  <footer>
    © 2026 RCN. All rights reserved.
  </footer>

  <div id="toast"></div>

  <script src="./script.js"></script>
</body>
</html>
